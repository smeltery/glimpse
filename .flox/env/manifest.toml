schema-version = "1.18.0"

[install]
go.pkg-path = "go"
go.version = "1.26.1"
bun.pkg-path = "bun"
bun.version = "1.3.11"
nodejs.pkg-path = "nodejs_22"
git.pkg-path = "git"
gnumake.pkg-path = "gnumake"
golangci-lint.pkg-path = "golangci-lint"
pre-commit.pkg-path = "pre-commit"
actionlint.pkg-path = "actionlint"

[vars]
NEXT_TELEMETRY_DISABLED = "1"

[hook]
on-activate = '''
  export PATH="$FLOX_ENV_PROJECT/node_modules/.bin:$PATH"
'''

[services.website]
command = "cd website && bun run dev --hostname 127.0.0.1"

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
